name: Build Geode Mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (for Geode CLI)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Geode CLI
        run: |
          cargo install geode-cli --locked
          geode profile add default
          geode sdk install

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        env:
          GEODE_SDK: ${{ github.workspace }}/.geode-sdk
        with:
          combine: true
          target: ${{ matrix.config.target }}
